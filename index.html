<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>Mehwar Digital Library | Islamic Books Online</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Mehwar Digital Library is an online Islamic digital library where you can read and download Urdu, Arabic, Hindi and English Islamic books."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Mehwar Digital Library, Islamic Books, Urdu Books, Arabic Books, Islamic Library, Online Islamic Books, Quran, Hadith, Fiqh, Tafsir"
    />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Website Author -->
    <meta
      name="author"
      content="Mehwar Digital Library"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#047857"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Mehwar Digital Library"
    />

    <meta
      property="og:description"
      content="Read and explore Islamic books online in Urdu, Arabic, Hindi and English."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Mehwar Digital Library"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
